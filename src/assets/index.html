<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Avalift</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2e7d32, #66bb6a);
      font-family: 'Arial', sans-serif;
      color: #fff;
    }
    
    .welcome {
      font-size: 2.5rem;
      text-align: center;
      overflow: hidden;
      border-right: .15em solid orange;
      white-space: nowrap;
      letter-spacing: .15em;
      animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: orange; }
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animation {
      font-size: 1.2rem;
      margin-top: 20px;
      opacity: 0;
      animation: fadeInUp 2s ease-in-out forwards 4s;
    }
  </style>
</head>
<body>

  <div>
    <div class="welcome">Welcome to the API session of Avalift</div>
    <div class="animation">
        Hire a personal chauffeur
        on-demand to safely drive your car anywhere in Dubai</div>
  </div>

</body>
</html>
